services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    ports:
      - "6333:6333"

  qdrant-init:
    image: curlimages/curl:8.12.1
    depends_on:
      - qdrant
    command:
      - sh
      - -c
      - |
        until curl -sf http://qdrant:6333/collections; do
          sleep 1
        done
        if curl -sf http://qdrant:6333/collections/evaluation >/dev/null; then
          exit 0
        fi
        curl -sf -X PUT http://qdrant:6333/collections/evaluation \
          -H 'Content-Type: application/json' \
          -d '{
            "vectors": {
              "dense": {
                "size": 1024,
                "distance": "Cosine"
              }
            },
            "sparse_vectors": {
              "sparse": {
                "modifier": "idf"
              }
            }
          }'
    restart: "no"

  index:
    build:
      context: ./index
    depends_on:
      - qdrant
    ports:
      - "8001:8000"

  
  ml-service:
    build:
      context: ./ml_service
    environment:
      # Ollama работает на хосте нативно — в контейнере нет доступа к GPU
      # Apple Silicon. LLM_URL позволяет указать другой OpenAI-совместимый
      # движок, не меняя код.
      LLM_URL: ${LLM_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b-instruct}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8003:8000"

  # Оркестратор индексации: строит чанки через index и пишет их в Qdrant.
  # На хакатоне эту роль выполняла закрытая система проверки.
  orchestrator:
    build:
      context: ./orchestrator
    depends_on:
      - index
      - ml-service
    environment:
      INDEX_SERVICE_URL: http://index:8000
      ML_SERVICE_URL: http://ml-service:8000
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: evaluation
    volumes:
      - ./data:/app/data
    ports:
      - "8004:8000"

  search:
    build:
      context: ./search
    depends_on:
      qdrant-init:
        condition: service_completed_successfully
      ml-service:
        condition: service_started
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: evaluation
      QDRANT_DENSE_VECTOR_NAME: dense
      QDRANT_SPARSE_VECTOR_NAME: sparse
      QDRANT_FUSION: ${QDRANT_FUSION:-DBSF}
      EMBEDDINGS_DENSE_URL: ${EMBEDDINGS_DENSE_URL:-http://ml-service:8000/embeddings}
      RERANKER_URL: ${RERANKER_URL:-http://ml-service:8000/score}
      OPEN_API_LOGIN: ${OPEN_API_LOGIN:-local}
      OPEN_API_PASSWORD: ${OPEN_API_PASSWORD:-local}
    ports:
      - "8002:8000"


  backend:
    build:
      context: ./backend
    depends_on:
      - search
      - orchestrator
    environment:
      SEARCH_URL: http://search:8000
      ORCHESTRATOR_URL: http://orchestrator:8000
      ML_SERVICE_URL: http://ml-service:8000
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: evaluation
      CHAT_FILE: ${CHAT_FILE:-Go Nova.json}
    volumes:
      - ./data:/app/data
      - ./eval/questions.json:/app/questions.json:ro
    ports:
      - "8005:8000"


  web-ui:
    build:
      context: ./web_service
    depends_on:
      - backend
    ports:
      - "8090:80"

